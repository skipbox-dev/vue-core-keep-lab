# Skipbox keep-build lab (skipbox-dev, home-1 lab): sharded Node unit tests with coverage.
# Started only by dispatch: the lab driver sends one shard per run to the lab label (one job for
# the lab's one machine), and all four to ubuntu-latest for the GitHub-hosted comparison.
name: keep-lab
run-name: keep-lab ${{ github.ref_name }} on ${{ inputs.runner }} ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      runner:
        default: skipbox-lab
      shards:
        default: '[1, 2, 3, 4]'
      tag:
        default: ''
permissions:
  contents: read
jobs:
  unit:
    name: Run Node unit tests with coverage (${{ matrix.shard }}/4)
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Probe kept checkout
        run: echo "LAB kept_workspace_entries=$(ls -A | wc -l) kept_root_node_modules_before_checkout=$([ -d node_modules ] && ls node_modules | wc -l || echo 0)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe kept state
        run: |
          echo "LAB runner=$RUNNER_NAME node_on_path=$(node --version 2>/dev/null || echo none) NODE_OPTIONS=[${NODE_OPTIONS:-}]"
          echo "LAB kept_root_node_modules=$([ -d node_modules ] && ls node_modules | wc -l || echo 0) kept_vitest_results=$([ -f node_modules/.vite/vitest/results.json ] && echo yes || echo no) is_odd=$([ -d node_modules/is-odd ] && echo yes || echo no)"
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Restore node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages-private/*/node_modules
          key: nm-${{ inputs.runner }}-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            nm-${{ inputs.runner }}-${{ runner.os }}-${{ github.ref_name }}-
            nm-${{ inputs.runner }}-${{ runner.os }}-
      - name: Install dependencies
        run: |
          echo "LAB after_restore is_odd=$([ -d node_modules/is-odd ] && echo yes || echo no)"
          pnpm install --frozen-lockfile
      - name: Run Node unit tests with coverage
        run: pnpm vitest run --project 'unit*' --coverage --coverage.reporter=text-summary --coverage.reporter=json-summary --shard=${{ matrix.shard }}/4
      - name: Coverage total
        if: always()
        run: node -e 'const t=require("./coverage/coverage-summary.json").total; console.log("LAB coverage lines="+t.lines.pct+" statements="+t.statements.pct+" branches="+t.branches.pct)' || true
